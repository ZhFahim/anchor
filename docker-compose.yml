services:
  anchor-plus:
    # This fork's image (amd64 and arm64), updated on every release. Pin a
    # release instead with e.g. ghcr.io/alxndrjhn/anchor:fork-0.17.2.36.
    image: ghcr.io/alxndrjhn/anchor:fork-latest
    # `docker compose up -d --build` builds it from this checkout instead.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anchor-plus
    restart: unless-stopped
    # Time to shut Postgres down cleanly on `docker compose down` and on every
    # `up --force-recreate`, before Docker kills what's left.
    stop_grace_period: 1m
    ports:
      - "3000:3000"
    environment:
      - PG_USER=anchor
      - PG_PASSWORD=password
      - PG_DATABASE=anchor
    volumes:
      - anchor_plus_data:/data

volumes:
  anchor_plus_data:
