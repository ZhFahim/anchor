name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  docker:
    uses: ./.github/workflows/docker-build.yml
    with:
      push: true
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}},enable=${{ !contains(github.ref, '-') }}
        type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}
        type=raw,value=next,enable=${{ contains(github.ref, '-') }}

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # The same version CI checks, so a release build cannot fail on a
          # newer SDK than the one the tests ran on.
          flutter-version: 3.47.9
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # A fork without the release keystore still needs an installable APK, so
      # this makes a throwaway key for that build. Google Play installs from a
      # real release need the repository's own secrets.
      - name: Decode and save keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          else
            echo "::warning::No release keystore secret, so this APK is signed with a new key. Android refuses to install it over a build signed with another key; uninstall first, and set ANDROID_KEYSTORE_BASE64 to keep updates installable."
            keytool -genkeypair -v -keystore android/app/upload-keystore.jks \
              -alias anchor -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass anchorfork -keypass anchorfork \
              -dname "CN=Anchor fork, OU=Build, O=Anchor, L=, S=, C=US"
          fi

      - name: Create key.properties
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            cat > android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=./upload-keystore.jks
          EOF
          else
            cat > android/key.properties << EOF
          storePassword=anchorfork
          keyPassword=anchorfork
          keyAlias=anchor
          storeFile=./upload-keystore.jks
          EOF
          fi

      - name: Build universal APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/anchor-${VERSION}.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/anchor-${VERSION}-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/anchor-${VERSION}-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/anchor-${VERSION}-x86_64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/anchor-*.apk

  create-release:
    runs-on: ubuntu-latest
    needs: [docker, build-android]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts

      - name: Generate Release Notes
        id: release_notes
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          configuration: ".github/release-config.json"
          outputFile: release-notes.md
          ignorePreReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            artifacts/anchor-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
