name: anchor
description: "An offline-first, self-hosted notes app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.18.0+23

environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0

  # State Management
  flutter_riverpod: ^3.4.3

  # Local DB
  drift: ^2.35.3
  flutter_secure_storage: ^11.2.0

  # Networking
  dio: ^5.11.1
  connectivity_plus: ^7.3.2

  # Routing
  go_router: ^17.5.0

  # Authentication
  flutter_appauth: ^13.0.0

  # UI
  lucide_icons_flutter: ^4.0.1

  # Code Generation Annotations
  riverpod_annotation: ^4.0.7
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Media
  image_picker: ^1.2.4
  cached_network_image: ^4.0.6
  just_audio: ^0.10.6
  record: ^7.1.2
  file_picker: ^13.3.0
  # Several pictures in a row, without leaving the app
  camera: ^0.12.2
  # Cropping and mirroring pictures placed in the text
  image: ^4.12.0
  mime: ^2.1.0
  share_plus: ^13.3.1
  gal: ^2.3.3

  # Reminders (device-local notifications)
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Rich Text Editor
  flutter_quill: ^11.6.0
  dart_quill_delta: ^10.8.3

  # Utilities
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  intl: ^0.20.3
  equatable: ^3.0.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  home_widget: ^0.10.0
  google_mlkit_text_recognition: ^0.17.1
  local_auth: ^3.0.2
  crypto: ^3.0.8
  archive: ^4.0.0
  workmanager: ^0.10.10
  zxing2: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Testing
  mocktail: ^1.0.5

  # Code Generation
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.2
  freezed: ^4.0.3
  json_serializable: ^6.15.2

  # Native splash screens
  flutter_native_splash: ^2.4.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Licenses sit next to the files (SIL OFL 1.1; the note fonts' are listed in
  # assets/fonts/README.md).
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
        - asset: assets/fonts/DMSans-VariableItalic.ttf
          style: italic
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
    # An italic of 500 or 600 falls back to the nearest italic file.
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/Literata-BoldItalic.ttf
          weight: 700
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    # Greek, Cyrillic and Vietnamese for the families that lack them; cut down
    # to those letters, see assets/fonts/README.md.
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
        - asset: assets/fonts/NotoSans-Italic-Variable.ttf
          style: italic
    # The fonts of the Neo-Brutalism and Lo-fi styles (Settings › Style).
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Patrick Hand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
    # Fonts for some words in a note (Aa › Color and font), shared with the
    # web; see assets/fonts/README.md.
    - family: Comic Neue
      fonts:
        - asset: assets/fonts/ComicNeue-Regular.ttf
        - asset: assets/fonts/ComicNeue-Bold.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: Special Elite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Roboto Slab
      fonts:
        - asset: assets/fonts/RobotoSlab.ttf
    - family: Permanent Marker
      fonts:
        - asset: assets/fonts/PermanentMarker-Regular.ttf

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
